<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101124"><title>ONEGAME ARCADE</title><style>:root{color-scheme:dark;font-family:system-ui,'Noto Sans JP',sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#30215b,#101124 60%);color:#fff;min-height:100vh}header{padding:42px 18px 24px;text-align:center}h1{font-size:clamp(32px,6vw,58px);letter-spacing:.08em;margin:0;color:#ffdb66;text-shadow:3px 3px #b23c96}header p{color:#c9c7dc}main{max-width:1050px;margin:auto;padding:0 20px 60px}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:15px 0 24px}.toolbar input{padding:12px 15px;background:#232440;border:1px solid #575474;color:white;border-radius:10px;min-width:230px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.card{background:#20223d;border:1px solid #514e79;border-radius:17px;overflow:hidden;box-shadow:0 8px 22px #0004}.art{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#53318a,#bd4888);font-size:64px}.details{padding:18px}.details h2{font-size:20px;margin:0 0 8px}.details p{font-size:14px;color:#c8c7d9;min-height:42px}.tag{font-size:12px;color:#ffda70}.play{display:block;text-align:center;background:#ffd15c;color:#251a37;padding:11px;border-radius:9px;text-decoration:none;font-weight:800;margin-top:14px}.play[aria-disabled=true]{background:#55546b;color:#c6c5d4;pointer-events:none}footer{text-align:center;color:#aaa9c4;padding:20px;font-size:12px}#empty{display:none;color:#c8c7d9}</style></head><body><header><h1>🕹 ONEGAME ARCADE</h1><p>ONEGAME浜松のオリジナルWebゲームセンター</p></header><main><div class="toolbar"><strong id="count"></strong><input id="search" type="search" placeholder="ゲームを検索" aria-label="ゲームを検索"></div><div class="grid" id="games"></div><p id="empty">該当するゲームはありません。</p></main><footer>© ONEGAME浜松 · Webゲームコレクション</footer><script src="games.js"></script><script>const grid=document.querySelector('#games'),count=document.querySelector('#count'),search=document.querySelector('#search'),empty=document.querySelector('#empty');function render(){const q=search.value.trim().toLowerCase(),items=GAME_LIST.filter(x=>(x.title+' '+x.description).toLowerCase().includes(q));grid.replaceChildren();for(const g of items){const c=document.createElement('article');c.className='card';const a=document.createElement('div');a.className='art';a.textContent=g.emoji;const d=document.createElement('div');d.className='details';const h=document.createElement('h2');h.textContent=g.title;const p=document.createElement('p');p.textContent=g.description;const t=document.createElement('span');t.className='tag';t.textContent=g.orientation==='portrait'?'📱 縦画面':'🖥 横画面';const link=document.createElement('a');link.className='play';link.textContent=g.url?'ゲームを遊ぶ →':'準備中';if(g.url){link.href=g.url;link.rel='noopener noreferrer'}else{link.setAttribute('aria-disabled','true')}d.append(h,p,t,link);c.append(a,d);grid.append(c)}count.textContent=`ゲーム ${items.length} 件`;empty.style.display=items.length?'none':'block'}search.addEventListener('input',render);render();</script></body></html>
