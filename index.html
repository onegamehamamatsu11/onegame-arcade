<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONEGAME ARCADE</title>
<style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;--accent:#ffd15c;--radius:17px;--bg:#101124;--card:#20223d;--border:#514e79;--fg:#fff;--muted:#c8c7d9;--hero:radial-gradient(circle at 50% 0,#30215b,#101124 65%)}*{box-sizing:border-box}body{margin:0;background:var(--hero);background-color:var(--bg);color:var(--fg);min-height:100vh}header{text-align:center;padding:42px 18px 25px}header img{display:block;max-height:110px;max-width:min(85vw,460px);object-fit:contain;margin:0 auto 12px}h1{font-size:clamp(30px,6vw,56px);letter-spacing:.045em;margin:0;color:var(--accent)}header p{color:var(--muted);margin:10px 0}main{max-width:1120px;margin:auto;padding:0 20px 60px}.notice{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin:0 0 20px;white-space:pre-wrap}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:15px 0 24px}.toolbar input{padding:12px 15px;background:var(--card);border:1px solid var(--border);color:var(--fg);border-radius:10px;min-width:230px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 22px #0003;display:flex;flex-direction:column}.art{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#53318a,#bd4888);font-size:64px}.art img{height:100%;width:100%;object-fit:cover}.details{padding:18px;display:flex;flex-direction:column;flex:1}.details h2{font-size:20px;margin:0 0 8px}.details p{font-size:14px;color:var(--muted);min-height:42px;white-space:pre-wrap}.tag{font-size:12px;color:var(--accent);margin-top:auto}.play{display:block;text-align:center;background:var(--accent);color:#171324;padding:11px;border-radius:9px;text-decoration:none;font-weight:800;margin-top:14px}.play[aria-disabled=true]{background:#666;color:#eee;pointer-events:none}footer{text-align:center;color:var(--muted);padding:20px;font-size:12px;white-space:pre-wrap}#empty{display:none;color:var(--muted)}
body[data-theme=modern]{--bg:#080f1c;--card:#17243b;--border:#334966;--muted:#bdcce0;--hero:linear-gradient(135deg,#080f1c,#13284a)}body[data-theme=pop]{--bg:#fff0f5;--card:#fff;--border:#ffbfd5;--fg:#43283d;--muted:#795b70;--hero:linear-gradient(120deg,#fff0f5,#e4f9ff)}body[data-theme=simple]{--bg:#f6f7fb;--card:#fff;--border:#d7dbe5;--fg:#1b2233;--muted:#5b6474;--hero:#f6f7fb}body[data-theme=pop] .art{background:linear-gradient(135deg,#ffb4cf,#a2ecff)}body[data-theme=simple] .art{background:linear-gradient(135deg,#e5e7eb,#c7d2fe)}@media(max-width:560px){header{padding-top:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:110px;font-size:46px}.details{padding:12px}.details h2{font-size:16px}.details p{font-size:12px}.toolbar input{width:100%}}
</style></head><body><header><img id="logo" hidden alt="サイトロゴ"><h1 id="siteTitle"></h1><p id="subtitle"></p></header><main><p class="notice" id="notice" hidden></p><div class="toolbar"><strong id="count"></strong><input id="search" type="search" placeholder="ゲームを検索" aria-label="ゲームを検索"></div><div class="grid" id="games"></div><p id="empty">該当するゲームはありません。</p></main><footer id="footer"></footer><script src="games.js"></script><script src="site-config.js"></script><script>
const cfg=SITE_CONFIG;document.body.dataset.theme=['retro','modern','pop','simple'].includes(cfg.theme)?cfg.theme:'retro';const safeColor=/^#[0-9a-fA-F]{6}$/.test(cfg.accent)?cfg.accent:'#ffd15c';document.documentElement.style.setProperty('--accent',safeColor);document.documentElement.style.setProperty('--radius',Math.max(0,Math.min(40,Number(cfg.radius)||0))+'px');if(cfg.font==='serif')document.documentElement.style.fontFamily='Georgia,serif';if(cfg.font==='rounded')document.documentElement.style.fontFamily='"Arial Rounded MT Bold",system-ui,sans-serif';if(cfg.background&&/^https:\/\//.test(cfg.background))document.body.style.backgroundImage='linear-gradient(#101124bb,#101124cc),url("'+encodeURI(cfg.background).replace(/["()]/g,'')+'")';if(cfg.columns==='2'||cfg.columns==='3'||cfg.columns==='4')document.getElementById('games').style.gridTemplateColumns='repeat('+cfg.columns+',minmax(0,1fr))';document.getElementById('siteTitle').textContent=cfg.siteTitle||'ONEGAME ARCADE';document.title=cfg.siteTitle||'ONEGAME ARCADE';document.getElementById('subtitle').textContent=cfg.subtitle||'';document.getElementById('footer').textContent=cfg.footer||'';if(cfg.notice){const n=document.getElementById('notice');n.textContent=cfg.notice;n.hidden=false}if(cfg.logo&&/^https:\/\//.test(cfg.logo)){const img=document.getElementById('logo');img.src=cfg.logo;img.hidden=false}
const grid=document.querySelector('#games'),count=document.querySelector('#count'),search=document.querySelector('#search'),empty=document.querySelector('#empty');function render(){const q=search.value.trim().toLowerCase(),items=GAME_LIST.filter(x=>x.visible!==false&&(x.title+' '+x.description).toLowerCase().includes(q));grid.replaceChildren();for(const g of items){const c=document.createElement('article');c.className='card';const a=document.createElement('div');a.className='art';if(g.image&&/^https:\/\//.test(g.image)){const img=document.createElement('img');img.src=g.image;img.alt=g.title+' の画像';img.loading='lazy';img.onerror=()=>{a.replaceChildren();a.textContent=g.emoji||'🎮'};a.append(img)}else a.textContent=g.emoji||'🎮';const d=document.createElement('div');d.className='details';const h=document.createElement('h2');h.textContent=g.title;const p=document.createElement('p');p.textContent=g.description;d.append(h,p);if(cfg.showOrientation!==false){const t=document.createElement('span');t.className='tag';t.textContent=g.orientation==='portrait'?'📱 縦画面':'🖥 横画面';d.append(t)}const link=document.createElement('a');link.className='play';link.textContent=g.url?'ゲームを遊ぶ →':'準備中';if(g.url&&/^https:\/\//.test(g.url)){link.href=g.url;link.rel='noopener noreferrer'}else{link.textContent='準備中';link.setAttribute('aria-disabled','true')}d.append(link);c.append(a,d);grid.append(c)}count.textContent=`ゲーム ${items.length} 件`;empty.style.display=items.length?'none':'block'}search.addEventListener('input',render);render();
</script></body></html>
